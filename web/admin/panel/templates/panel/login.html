{% extends "panel/base.html" %}
{% block titulo %}Iniciar sesión{% endblock %}
{% block contenido %}
<div class="login" style="min-height: 80vh">
  <div class="login-caja">
    <div class="fila entre" style="margin-bottom: 28px">
      <div class="logo">Pide<span>Cerca</span><span class="etiqueta-admin">Admin</span></div>
      <button class="boton-icono" type="button" data-alternar-modo aria-label="Cambiar modo"><span data-icono-modo>☀</span></button>
    </div>
    <h1 style="margin: 0 0 6px; font-size: 26px">Panel de administración</h1>
    <p class="subtexto" style="margin: 0 0 24px">Supervisa usuarios, negocios y pedidos de la plataforma.</p>
    <form method="post" class="formulario tarjeta" style="padding: 20px">
      {% csrf_token %}
      <div class="campo">
        <label for="correo">Correo del administrador</label>
        <input id="correo" name="correo" type="email" value="{{ correo }}" autocomplete="username" required>
      </div>
      <div class="campo">
        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <button class="boton principal grande ancho">Iniciar sesión</button>
    </form>
  </div>
</div>
{% endblock %}
