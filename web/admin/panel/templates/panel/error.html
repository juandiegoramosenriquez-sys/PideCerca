{% extends "panel/base.html" %}
{% block titulo %}Error{% endblock %}
{% block contenido %}
<div class="tarjeta" style="max-width: 560px; margin: 40px auto; text-align: center; padding: 28px">
  <h1 style="margin: 0 0 8px; font-size: 22px">No se pudo cargar la información</h1>
  <p class="subtexto">{{ mensaje }}</p>
  <div class="fila" style="justify-content: center; margin-top: 16px">
    <a class="boton secundario" href="javascript:history.back()">Volver</a>
    <a class="boton principal" href="{% url 'resumen' %}">Ir al resumen</a>
  </div>
</div>
{% endblock %}
